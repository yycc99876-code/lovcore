<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lovcore Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup" id="popup">

    <!-- Header: Logo + Brand + Shortcut -->
    <div class="header">
      <svg class="logo" width="22" height="22" viewBox="-4 -9 133 133" fill="none">
        <path d="M49.5 106.5C35.2 107.8 22.9 101.4 18.2 90.5C13.2 78.8 17.8 64.9 30.5 53.6C40.4 44.8 54.4 38.4 68.2 32.8C82 27.2 91.5 19 89.9 8.8C88.1 -2.6 73.2 -4.5 61.9 3.4C48.9 12.5 39.4 30.1 37.3 51.2C34.6 77.5 43.2 103.5 61.2 113.1C76.6 121.3 95.8 115.2 104.5 99.2C113 83.7 109.1 64.3 96 53.2C88.8 47.1 80.6 44.1 72.5 44.5" stroke="#FAF7F2" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="61.5" cy="67.5" r="8.5" fill="#FF4F3F"/>
      </svg>
      <span class="title">Lovcore</span>
      <span class="shortcut" title="Keyboard shortcut">Ctrl+Shift+L</span>
    </div>

    <!-- Login Banner -->
    <div id="loginBanner" class="login-banner hidden">
      <svg class="login-banner-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="loginBannerText">Please log in to Lovcore first</span>
    </div>

    <!-- Clip Content Area (switches based on clip type) -->
    <div id="clipContent" class="clip-content">
      <!-- Page mode (default) -->
      <div id="modePage" class="clip-mode">
        <div class="page-preview">
          <div class="page-screenshot" id="pageScreenshot">
            <div class="screenshot-shimmer" id="screenshotShimmer"></div>
          </div>
          <div class="page-meta">
            <div class="page-title-row">
              <img class="page-favicon" id="pageFavicon" alt="" width="14" height="14">
              <div class="page-title" id="pageTitle">
                <div class="skeleton skeleton-title"></div>
              </div>
            </div>
            <div class="page-domain" id="pageDomain">
              <div class="skeleton skeleton-domain"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Selection mode -->
      <div id="modeSelection" class="clip-mode hidden">
        <div class="selection-preview">
          <div class="selection-label">Selected text</div>
          <div class="selection-text" id="selectionText"></div>
          <div class="selection-source" id="selectionSource"></div>
        </div>
      </div>

      <!-- Image mode -->
      <div id="modeImage" class="clip-mode hidden">
        <div class="image-preview">
          <div class="image-preview-box" id="imagePreviewBox">
            <div class="screenshot-shimmer"></div>
          </div>
          <div class="image-meta">
            <div class="image-label">Image</div>
            <div class="image-url" id="imageUrl"></div>
          </div>
        </div>
      </div>

      <!-- Link mode -->
      <div id="modeLink" class="clip-mode hidden">
        <div class="link-preview">
          <svg class="link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <div class="link-meta">
            <div class="link-title" id="linkTitle"></div>
            <div class="link-url" id="linkUrl"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Note Input -->
    <div class="note-section">
      <input type="text" id="noteInput" class="note-input" placeholder="Add a note (optional)" maxlength="500">
    </div>

    <!-- Save Type Indicator -->
    <div class="save-type" id="saveType">
      <span class="save-type-dot" id="saveTypeDot"></span>
      <span id="saveTypeLabel">page</span>
    </div>

    <!-- Save Button -->
    <button id="saveBtn" class="save-btn">
      <span id="saveBtnIcon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2v8m0 0l3-3m-3 3L5 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span id="saveBtnText">Save to Lovcore</span>
    </button>

    <!-- Error Actions (hidden by default) -->
    <div id="errorActions" class="error-actions hidden">
      <button id="retryBtn" class="action-btn action-retry">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Retry
      </button>
      <button id="linkOnlyBtn" class="action-btn action-secondary">
        Save link only
      </button>
      <button id="openLovcoreBtn" class="action-btn action-secondary">
        Open Lovcore
      </button>
    </div>

    <!-- Status -->
    <div id="status" class="status hidden"></div>

    <!-- Footer: History Toggle -->
    <div class="footer">
      <button id="historyToggle" class="history-toggle">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        Recent clips
      </button>
      <span class="footer-shortcut"><kbd>Ctrl</kbd>+<kbd>Enter</kbd></span>
    </div>

    <!-- History Panel (hidden by default) -->
    <div id="historyPanel" class="history-panel hidden">
      <div class="history-header">
        <span class="history-title">Recent Clips</span>
        <button id="historyClose" class="history-close">&times;</button>
      </div>
      <div id="historyList" class="history-list">
        <div class="history-empty">No clips yet</div>
      </div>
      <!-- Queue section -->
      <div id="queueSection" class="queue-section hidden">
        <div class="queue-header">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>Failed clips</span>
        </div>
        <div id="queueList" class="queue-list"></div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
