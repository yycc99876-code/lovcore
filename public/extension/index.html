<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>安装 Lovcore Clipper</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2;
        --text: #171412;
        --muted: #6f6860;
        --card: #fffdf9;
        --border: #e6ded4;
        --accent: #e85b4f;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121110;
          --text: #faf7f2;
          --muted: #aaa39b;
          --card: #1b1917;
          --border: #332f2b;
          --accent: #ff7164;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(760px, calc(100% - 40px));
        margin: 0 auto;
        padding: 72px 0;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 7vw, 72px);
        line-height: 1;
        letter-spacing: 0;
      }

      .lead {
        max-width: 620px;
        margin: 22px 0 32px;
        color: var(--muted);
        font-size: 18px;
      }

      .download {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 8px;
        background: var(--text);
        color: var(--bg);
        font-weight: 700;
        text-decoration: none;
      }

      section {
        margin-top: 40px;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
      }

      h2 {
        margin: 0 0 14px;
        font-size: 18px;
      }

      ol {
        margin: 0;
        padding-left: 22px;
      }

      code {
        padding: 2px 6px;
        border-radius: 5px;
        background: color-mix(in srgb, var(--muted) 14%, transparent);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Lovcore Clipper</p>
      <h1>安装浏览器插件</h1>
      <p class="lead">下载 zip 后解压，在 Chrome 扩展管理页加载已解压的插件。安装后可保存当前网页、选中文字和页面截图到 Lovcore。</p>
      <a class="download" href="/downloads/lovcore-clipper.zip" download>下载 Lovcore Clipper</a>

      <section>
        <h2>安装步骤</h2>
        <ol>
          <li>下载 <code>lovcore-clipper.zip</code> 并解压。</li>
          <li>打开 Chrome，进入 <code>chrome://extensions</code>。</li>
          <li>开启右上角的开发者模式。</li>
          <li>点击“加载已解压的扩展程序”，选择解压后的文件夹。</li>
          <li>登录 <code>lovecore.com</code> 后，点击插件即可保存网页。</li>
        </ol>
      </section>
    </main>
  </body>
</html>
